name: Publish verified WUBROT v0.2.183 binaries
on:
  push:
    branches: ['release-v0.2.183']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify binary-only release assets
        run: |
          cd release
          sha256sum --check SHA256SUMS.txt
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          assert sorted(p.name for p in Path('.').iterdir())==['SHA256SUMS.txt','WUBROT-0.2.183-Windows-x64.zip','WUBROT-setup.zip']
          with zipfile.ZipFile('WUBROT-setup.zip') as z:
              assert z.testzip() is None and z.namelist()==['WUBROT-setup.exe','READ ME FIRST.txt']
              assert z.read('WUBROT-setup.exe').startswith(b'MZ')
          with zipfile.ZipFile('WUBROT-0.2.183-Windows-x64.zip') as z:
              assert z.testzip() is None
              assert all(n.startswith('WUBROT.vst3/') and '..' not in n.split('/') for n in z.namelist())
              assert z.read('WUBROT.vst3/Contents/x86_64-win/WUBROT.vst3').startswith(b'MZ')
          PY
      - name: Create and verify draft before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash -euo pipefail .github/publish.sh 2>&1 | tee publish-output.log
      - name: Record publication attempt
        if: always()
        env:
          PUBLISH_RESULT: ${{ job.status }}
        run: |
          python3 - <<'PYREPORT'
          import os,json
          from pathlib import Path
          p=Path('publish-output.log')
          data={'result':os.environ['PUBLISH_RESULT'],'run':os.environ['GITHUB_RUN_ID'],'url':'https://github.com/spockverse/WUBROT/actions/runs/'+os.environ['GITHUB_RUN_ID'],'log':'\n'.join(p.read_text().splitlines()[-80:]) if p.exists() else 'Release asset verification failed before publication.'}
          Path(os.environ['RUNNER_TEMP']+'/publish-attempt.json').write_text(json.dumps(data,indent=2))
          PYREPORT
          git fetch origin main
          git worktree add --detach "$RUNNER_TEMP/public-attempt" FETCH_HEAD
          cd "$RUNNER_TEMP/public-attempt"
          git config user.name 'WUBROT release bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp "$RUNNER_TEMP/publish-attempt.json" publish-attempt.json
          git add publish-attempt.json
          git commit -m 'Record public release publication result [skip ci]'
          git push origin HEAD:refs/heads/main
